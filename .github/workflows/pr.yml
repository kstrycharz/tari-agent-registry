name: PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  registry:
    name: Registry and security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted base tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install trusted scanner dependencies
        run: python -I -m pip install --require-hashes -r trusted/requirements-ci.lock
      - name: Validate candidate with base policy
        run: python -I trusted/registry/core.py validate --root candidate --previous trusted
      - name: Test trusted validator
        run: python -I -m unittest discover -s trusted/tests -v
      - name: Static Python analysis (no candidate config or suppressions)
        run: python -I -m bandit --ini trusted/policy/bandit.ini -c trusted/policy/bandit.yaml -r candidate/registry candidate/packages --ignore-nosec
      - name: Test trusted website client
        run: node --test trusted/integrations/taritracker/registry.test.mjs
      - name: Install antivirus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - name: Scan candidate tree
        run: clamscan --recursive --infected --max-filesize=2M --max-scansize=100M --alert-exceeds-max=yes --exclude-dir='[/\\]\.git$' candidate
