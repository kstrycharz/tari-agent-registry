name: Publish registry
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-registry
  cancel-in-progress: false
jobs:
  build:
    name: Scan and package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -I -m pip install --require-hashes -r requirements-ci.lock
      - run: python -I registry/core.py validate
      - run: python -I -m unittest discover -s tests -v
      - run: python -I -m bandit --ini policy/bandit.ini -c policy/bandit.yaml -r registry packages --ignore-nosec
      - run: node --test integrations/taritracker/registry.test.mjs
      - name: Antivirus scan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --recursive --infected --max-filesize=2M --max-scansize=100M --alert-exceeds-max=yes --exclude-dir='[/\\]\.git$' packages registry
      - name: Build catalog and archives
        env:
          REVISION: ${{ github.sha }}
        run: python -I registry/core.py build --revision "$REVISION"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
